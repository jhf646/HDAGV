<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点位配置管理</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      color: #1f2a37;
      padding: 16px;
    }
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
    }
    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn {
      height: 34px;
      border: 1px solid #c9d4e3;
      border-radius: 8px;
      background: #fff;
      color: #243042;
      padding: 0 12px;
      cursor: pointer;
    }
    .btn.primary {
      border-color: #1976d2;
      background: #1976d2;
      color: #fff;
    }
    .search {
      width: 240px;
      height: 34px;
      border: 1px solid #c9d4e3;
      border-radius: 8px;
      padding: 0 10px;
      background: #fff;
    }
    .panel {
      border: 1px solid #dbe5f0;
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .meta {
      padding: 10px 12px;
      border-bottom: 1px solid #edf2f7;
      background: #f8fbff;
      font-size: 13px;
      color: #5e7189;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-bottom: 1px solid #edf2f7;
      padding: 9px 10px;
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }
    th {
      background: #f9fbff;
      color: #4c6078;
      font-weight: 700;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .table-wrap {
      max-height: calc(100vh - 180px);
      overflow: auto;
    }
    .label-input {
      width: 100%;
      min-width: 220px;
      height: 34px;
      border: 1px solid #c9d4e3;
      border-radius: 8px;
      padding: 0 10px;
    }
    .readonly {
      color: #2f4057;
      font-weight: 600;
    }
    .row-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #6f8096;
    }
    .status {
      font-size: 12px;
      color: #4f6380;
      min-width: 130px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">点位配置管理</div>
      <div class="actions">
        <input id="searchInput" class="search" type="text" placeholder="搜索 点位名称 / 点位编号 / 点位地图" />
        <button id="rebuildBtn" class="btn" type="button">前端一键重建</button>
        <button id="reloadBtn" class="btn" type="button">刷新</button>
        <button id="backBtn" class="btn" type="button">返回</button>
      </div>
    </div>

    <div class="panel">
      <div id="meta" class="meta">加载中...</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 36%">点位名称（可编辑）</th>
              <th style="width: 22%">点位编号（只读）</th>
              <th style="width: 18%">点位地图（只读）</th>
              <th style="width: 24%">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="hint">说明：仅允许修改“点位名称”，点位编号和点位地图不可编辑。</div>
  </div>

  <script>
    const qs = new URLSearchParams(window.location.search);

    function normalizeBaseUrl(urlText) {
      const val = String(urlText || '').trim();
      if (!val) return '';
      if (/^https?:\/\//i.test(val)) return val.replace(/\/$/, '');
      return ('http://' + val).replace(/\/$/, '');
    }

    function getApiCandidates() {
      const list = [];
      const fromQuery = normalizeBaseUrl(qs.get('apiHost') || '');
      if (window.location.protocol.startsWith('http')) {
        list.push(window.location.origin.replace(/\/$/, ''));
      }
      if (fromQuery) list.push(fromQuery);
      const host = String(window.location.hostname || '').trim();
      if (host) list.push('http://' + host + ':3000');
      list.push('http://127.0.0.1:3000');
      list.push('http://localhost:3000');
      return Array.from(new Set(list.filter(Boolean)));
    }

    const tbody = document.getElementById('tbody');
    const meta = document.getElementById('meta');
    let allRows = [];
    let currentBase = '';

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, function(ch){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]);
      });
    }

    function renderRows(rows) {
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="color:#6f8096">暂无数据</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(function(row){
        return '<tr data-value="' + escapeHtml(row.value) + '">' +
          '<td><input class="label-input" data-role="label" value="' + escapeHtml(row.label) + '" /></td>' +
          '<td class="readonly">' + escapeHtml(row.value) + '</td>' +
          '<td class="readonly">' + escapeHtml(row.map) + '</td>' +
          '<td>' +
            '<div class="row-actions">' +
              '<button class="btn primary" data-role="save">保存名称</button>' +
              '<span class="status" data-role="status"></span>' +
            '</div>' +
          '</td>' +
        '</tr>';
      }).join('');
    }

    function applyFilter() {
      const key = String(document.getElementById('searchInput').value || '').trim().toLowerCase();
      if (!key) {
        renderRows(allRows);
        return;
      }
      const filtered = allRows.filter(function(r){
        return String(r.label || '').toLowerCase().includes(key)
          || String(r.value || '').toLowerCase().includes(key)
          || String(r.map || '').toLowerCase().includes(key);
      });
      renderRows(filtered);
    }

    async function loadRows() {
      const bases = getApiCandidates();
      let lastErr = '';
      for (const base of bases) {
        try {
          const resp = await fetch(base + '/api/position-codes');
          if (!resp.ok) {
            lastErr = 'HTTP ' + resp.status;
            continue;
          }
          const data = await resp.json();
          if (!data || !data.ok || !Array.isArray(data.rows)) {
            lastErr = '返回格式错误';
            continue;
          }
          currentBase = base;
          allRows = data.rows;
          meta.textContent = '接口：' + base + ' | 共 ' + allRows.length + ' 条';
          applyFilter();
          return;
        } catch (e) {
          lastErr = String(e && e.message ? e.message : e);
        }
      }
      meta.textContent = '加载失败：' + lastErr;
      allRows = [];
      renderRows([]);
    }

    async function saveLabel(value, label, statusEl) {
      if (!currentBase) {
        statusEl.textContent = '未连接后端';
        return;
      }
      statusEl.textContent = '保存中...';
      try {
        const resp = await fetch(currentBase + '/api/position-codes/' + encodeURIComponent(value) + '/label', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ label: label })
        });
        const data = await resp.json().catch(function(){ return {}; });
        if (!resp.ok || !data.ok) {
          statusEl.textContent = '失败：' + String(data.error || ('HTTP ' + resp.status));
          return;
        }

        const idx = allRows.findIndex(function(r){ return String(r.value) === String(value); });
        if (idx >= 0) allRows[idx].label = label;
        statusEl.textContent = '已保存';
      } catch (e) {
        statusEl.textContent = '失败：' + String(e && e.message ? e.message : e);
      }
    }

    async function rebuildTableFromFrontend() {
      if (!currentBase) {
        alert('未连接后端，无法重建');
        return;
      }
      const ok = window.confirm('将删除并重建点位表，再按最新配置全量导入。是否继续？');
      if (!ok) return;

      const rebuildBtn = document.getElementById('rebuildBtn');
      const oldText = rebuildBtn.textContent;
      rebuildBtn.disabled = true;
      rebuildBtn.textContent = '重建中...';

      try {
        const resp = await fetch(currentBase + '/api/position-codes/rebuild', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });
        const data = await resp.json().catch(function(){ return {}; });
        if (!resp.ok || !data.ok) {
          alert('重建失败：' + String(data.error || ('HTTP ' + resp.status)));
          return;
        }

        await loadRows();
        alert('重建成功，已导入 ' + String(data.rebuilt || 0) + ' 条点位');
      } catch (e) {
        alert('重建失败：' + String(e && e.message ? e.message : e));
      } finally {
        rebuildBtn.disabled = false;
        rebuildBtn.textContent = oldText;
      }
    }

    document.getElementById('reloadBtn').addEventListener('click', loadRows);
    document.getElementById('rebuildBtn').addEventListener('click', rebuildTableFromFrontend);
    document.getElementById('searchInput').addEventListener('input', applyFilter);
    document.getElementById('backBtn').addEventListener('click', function(){
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = 'api-tester.html';
      }
    });

    tbody.addEventListener('click', function(e){
      const target = e.target;
      if (!target || target.getAttribute('data-role') !== 'save') return;
      const tr = target.closest('tr');
      if (!tr) return;
      const value = tr.getAttribute('data-value') || '';
      const labelEl = tr.querySelector('[data-role="label"]');
      const statusEl = tr.querySelector('[data-role="status"]');
      const label = String(labelEl && labelEl.value || '').trim();
      if (!label) {
        statusEl.textContent = '点位名称不能为空';
        return;
      }
      saveLabel(value, label, statusEl);
    });

    loadRows();
  </script>
</body>
</html>
