<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AGV任务状态</title>
<script src="./position-code-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft YaHei",sans-serif;background:#f0f2f5;color:#333;font-size:14px}
header{background:#1565c0;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:700}
header .back{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.wrap{padding:12px}
.panel{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:12px}
label{display:block;font-size:12px;color:#666;margin-bottom:6px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.panel-head label{margin:0}
.mini-btn{height:28px;border:1px solid #177ddc;background:#177ddc;color:#fff;border-radius:6px;padding:0 10px;font-size:12px;cursor:pointer}
.task-meta{font-size:12px;color:#666}
.task-record-empty{color:#999;text-align:left}
.status-badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;line-height:1.5;border:1px solid #d9d9d9;background:#f5f5f5;color:#333}
.status-badge.done{background:#f6ffed;border-color:#b7eb8f;color:#237804}
.status-badge.pending{background:#fff7e6;border-color:#ffd591;color:#ad4e00}
.action-btn{height:26px;border:1px solid #d4380d;background:#d4380d;color:#fff;border-radius:6px;padding:0 8px;font-size:12px;cursor:pointer}
.action-btn[disabled]{opacity:.65;cursor:not-allowed}
.action-text{font-size:12px;color:#237804;font-weight:600}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;background:#f9f9f9;border-radius:6px;margin-bottom:8px}
.filter-row label{margin:0;font-size:12px;color:#666;min-width:40px}
.filter-row input[type="date"]{height:28px;padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px}
.filter-row .filter-btn{height:28px;border:1px solid #177ddc;background:#177ddc;color:#fff;border-radius:6px;padding:0 12px;font-size:12px;cursor:pointer}
.filter-row .filter-btn:hover{background:#0c5aa6}
.filter-row .export-btn{height:28px;border:1px solid #52c41a;background:#52c41a;color:#fff;border-radius:6px;padding:0 12px;font-size:12px;cursor:pointer}
.filter-row .export-btn:hover{background:#389e0d}
.filter-row .reset-btn{height:28px;border:1px solid #999;background:#fff;color:#666;border-radius:6px;padding:0 12px;font-size:12px;cursor:pointer}
.filter-row .reset-btn:hover{background:#f5f5f5}
.table-box{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
th{background:#f5f5f5;color:#555;font-weight:600}
@media (max-width:480px){.actions{width:100%;justify-content:flex-end}}
</style>
</head>
<body>
<header>
  <h1>🤖 AGV任务状态</h1>
  <button class="back" type="button" onclick="goBack()">← 返回</button>
</header>
<div class="wrap">
  <div class="panel table-box">
    <div class="panel-head">
      <label>任务记录（当日）</label>
      <div class="actions" style="margin:0">
        <span id="taskRecordMeta" class="task-meta">未加载</span>
        <button id="refreshTaskRecordsBtn" class="mini-btn" type="button">刷新任务记录</button>
      </div>
    </div>
    <div class="filter-row">
      <label>开始日期</label>
      <input type="date" id="startDateInput"/>
      <label style="margin-left:12px">结束日期</label>
      <input type="date" id="endDateInput"/>
      <button class="filter-btn" id="filterBtn" type="button">筛选</button>
      <button class="reset-btn" id="resetFilterBtn" type="button">重置</button>
      <button class="export-btn" id="exportExcelBtn" type="button">📥 导出Excel</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>时间</th>
          <th>任务编号</th>
          <th>发货点</th>
          <th>收货点</th>
          <th>任务状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="taskRecordTbody">
        <tr><td colspan="8" class="task-record-empty">暂无任务记录</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const appConfig = window.AGV_APP_CONFIG || {};
const qs = new URLSearchParams(window.location.search);
const addressConfig = { backend: {} };
const defaultTargetIp = String(appConfig.defaultTargetIp || '192.168.111.70:8182');
const TASK_STATUS_ENDPOINT = '/rcms/services/rest/hikRpcService/queryTaskStatus';
const CANCEL_TASK_ENDPOINT = '/rcms/services/rest/hikRpcService/cancelTask';
let allTaskRecords = [];
let filteredTaskRecords = [];
let taskStatusMapCache = {};

function normalizeBaseUrl(urlText) {
  const val = String(urlText || '').trim();
  if (!val) return '';
  if (/^https?:\/\//i.test(val)) return val.replace(/\/$/, '');
  return ('http://' + val).replace(/\/$/, '');
}

async function loadAddressConfig(){
  try {
    const resp = await fetch('./request-address-config.json?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) return;
    const cfg = await resp.json();
    if (cfg && typeof cfg === 'object') {
      addressConfig.backend = cfg.backend || {};
    }
  } catch (e) {
    // 配置文件不可用时忽略
  }
}

function getBackendBaseUrl() {
  const apiHostFromQuery = normalizeBaseUrl(qs.get('apiHost') || '');
  const fromCfg = normalizeBaseUrl(addressConfig?.backend?.baseUrl || '');
  const fromOrigin = /^https?:$/i.test(window.location.protocol) ? window.location.origin.replace(/\/$/, '') : '';
  return apiHostFromQuery || fromCfg || fromOrigin || 'http://localhost:3000';
}

function getTargetRcsBaseUrl() {
  const targetIpFromQuery = String(qs.get('targetIp') || '').trim();
  const raw = targetIpFromQuery || defaultTargetIp || '';
  if (!raw) return '';
  if (/^https?:\/\//i.test(raw)) return raw.replace(/\/$/, '');
  return ('http://' + raw).replace(/\/$/, '');
}

function getProxyCandidates() {
  const list = [];
  const fromBase = getBackendBaseUrl();
  if (fromBase) list.push(fromBase + '/proxy');
  if (/^https?:$/i.test(window.location.protocol)) {
    list.push(window.location.origin.replace(/\/$/, '') + '/proxy');
  }
  list.push('http://localhost:3000/proxy');
  list.push('http://127.0.0.1:3000/proxy');
  return Array.from(new Set(list));
}

function getPositionNameMap() {
  try {
    const options = window.AGV_APP_CONFIG
      ?.fieldConfig
      ?.genAgvSchedulingTask
      ?.positionCodePath
      ?.positionCode;
    if (!Array.isArray(options)) {
      return {};
    }
    const map = {};
    options.forEach(item => {
      if (item && item.value != null && item.label) {
        map[String(item.value)] = item.label;
      }
    });
    return map;
  } catch (e) {
    return {};
  }
}

const POSITION_NAME_MAP = getPositionNameMap();

function toPositionName(code) {
  const key = String(code || '').trim();
  if (!key) {
    return '-';
  }
  return POSITION_NAME_MAP[key] || key;
}

function getTaskStatsCandidates() {
  const list = [];
  const fromBase = getBackendBaseUrl();
  if (fromBase) {
    list.push(fromBase + '/api/task-stats');
  }
  if (/^https?:$/i.test(window.location.protocol)) {
    list.push('/api/task-stats');
    if (window.location.hostname) {
      list.push('http://' + window.location.hostname + ':3000/api/task-stats');
    }
  }
  list.push('http://localhost:3000/api/task-stats');
  list.push('http://127.0.0.1:3000/api/task-stats');
  return Array.from(new Set(list));
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return String(text || '').replace(/[&<>"']/g, m => map[m]);
}

function extractTaskCodeFromResp(respBody) {
  const raw = String(respBody || '').trim();
  if (!raw) return '';

  function pickTaskCode(obj) {
    if (!obj || typeof obj !== 'object') {
      return '';
    }

    const direct = [
      obj.taskCode,
      obj.task_code,
      obj.mainTaskCode,
      obj.main_task_code,
      obj.code,
    ];
    for (const val of direct) {
      const text = String(val == null ? '' : val).trim();
      if (text && text !== '[object Object]') {
        return text;
      }
    }

    if (Array.isArray(obj.data)) {
      for (const item of obj.data) {
        const found = pickTaskCode(item);
        if (found) return found;
      }
    }

    if (obj.data && typeof obj.data === 'object') {
      const found = pickTaskCode(obj.data);
      if (found) return found;
    }

    return '';
  }

  try {
    const parsed = JSON.parse(raw);
    const fromStructured = pickTaskCode(parsed);
    if (fromStructured) return fromStructured;

    const dataVal = String(parsed?.data == null ? '' : parsed.data).trim();
    if (dataVal && dataVal !== '[object Object]') return dataVal;
  } catch (e) {
    // 非JSON时继续用正则尝试
  }

  const keyPatterns = [
    /"taskCode"\s*:\s*"([^"]+)"/,
    /"task_code"\s*:\s*"([^"]+)"/,
    /"mainTaskCode"\s*:\s*"([^"]+)"/,
    /"main_task_code"\s*:\s*"([^"]+)"/,
    /"data"\s*:\s*"([^"]+)"/
  ];

  for (const pattern of keyPatterns) {
    const match = raw.match(pattern);
    const value = match && match[1] ? String(match[1]).trim() : '';
    if (value) return value;
  }

  return '';
}

function extractAgvCodeFromRawBody(rawBody) {
  const raw = String(rawBody || '').trim();
  if (!raw) return '';
  try {
    const parsed = JSON.parse(raw);
    const agvCode = String(parsed?.agvCode || '').trim();
    if (agvCode) return agvCode;
  } catch (e) {
    // 非JSON时继续用正则尝试
  }
  const match = raw.match(/"agvCode"\s*:\s*"([^"]+)"/);
  return match && match[1] ? String(match[1]).trim() : '';
}

function extractTaskCodeFromRawBody(rawBody) {
  const raw = String(rawBody || '').trim();
  if (!raw) return '';
  try {
    const parsed = JSON.parse(raw);
    const direct = [
      parsed?.taskCode,
      parsed?.task_code,
      parsed?.mainTaskCode,
      parsed?.main_task_code,
      parsed?.code,
    ];
    for (const val of direct) {
      const text = String(val == null ? '' : val).trim();
      if (text && text !== '[object Object]') {
        return text;
      }
    }
  } catch (e) {
    // 非JSON时继续用正则尝试
  }

  const keyPatterns = [
    /"taskCode"\s*:\s*"([^"]+)"/,
    /"task_code"\s*:\s*"([^"]+)"/,
    /"mainTaskCode"\s*:\s*"([^"]+)"/,
    /"main_task_code"\s*:\s*"([^"]+)"/
  ];
  for (const pattern of keyPatterns) {
    const match = raw.match(pattern);
    const value = match && match[1] ? String(match[1]).trim() : '';
    if (value) return value;
  }

  return '';
}

function extractTaskCodeFromStatusItem(item) {
  if (!item || typeof item !== 'object') {
    return '';
  }
  const candidates = [
    item.taskCode,
    item.task_code,
    item.mainTaskCode,
    item.main_task_code,
    item.code,
    item.data,
  ];
  for (const val of candidates) {
    const text = String(val == null ? '' : val).trim();
    if (text && text !== '[object Object]') {
      return text;
    }
  }
  return '';
}

function normalizeTaskStatusLabel(rawStatus) {
  const val = String(rawStatus == null ? '' : rawStatus).trim();
  if (!val) return '未知';
  const map = {
    '1': '已创建',
    '2': '正在执行',
    '5': '取消完成',
    '9': '已结束'
  };
  if (map[val]) {
    return map[val];
  }
  return val;
}

function isTaskDone(rawStatus) {
  const val = String(rawStatus == null ? '' : rawStatus).trim().toLowerCase();
  return val === '9' || val === 'done' || val === 'finish' || val === 'finished' || val === 'end' || val.includes('完成');
}

function isTaskRunning(rawStatus) {
  const val = String(rawStatus == null ? '' : rawStatus).trim().toLowerCase();
  return val === '2' || val === 'running' || val === 'executing' || val.includes('执行中') || val.includes('正在执行');
}

function isTaskTerminalStatus(rawStatus) {
  const val = String(rawStatus == null ? '' : rawStatus).trim();
  return val === '5' || val === '9';
}

async function callProxyJson(targetUrl, body) {
  const proxyCandidates = getProxyCandidates();
  let lastError = '';
  for (const proxyUrl of proxyCandidates) {
    try {
      const resp = await fetch(proxyUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          url: targetUrl,
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body
        })
      });
      const text = await resp.text();
      if (!resp.ok) {
        lastError = 'proxy ' + proxyUrl + ' HTTP ' + resp.status + ' ' + String(text || '').slice(0, 180);
        continue;
      }
      try {
        return JSON.parse(text);
      } catch (e) {
        return { rawText: text };
      }
    } catch (e) {
      lastError = 'proxy ' + proxyUrl + ' ' + String(e && e.message ? e.message : e);
    }
  }
  throw new Error(lastError || '代理调用失败');
}

async function batchQueryTaskStatus(taskRecords) {
  const records = Array.isArray(taskRecords) ? taskRecords : [];
  const expectedTaskCodes = Array.from(new Set(records.map(item => String(item?.taskCode || '').trim()).filter(Boolean)));
  if (expectedTaskCodes.length === 0) {
    return {};
  }
  const targetBase = getTargetRcsBaseUrl();
  if (!targetBase) {
    return {};
  }
  const map = {};

  async function queryByTaskCode(taskCode) {
    const payload = {
      reqCode: String(Date.now()) + '-' + taskCode,
      reqTime: '',
      clientCode: '',
      tokenCode: '',
      agvCode: '',
      taskCodes: [taskCode]
    };
    const data = await callProxyJson(targetBase + TASK_STATUS_ENDPOINT, payload);
    const rows = Array.isArray(data?.data) ? data.data : [];
    if (rows.length === 0) {
      return null;
    }

    const exact = rows.find(item => extractTaskCodeFromStatusItem(item) === taskCode);
    return exact || rows[0] || null;
  }

  const concurrency = 6;
  for (let i = 0; i < expectedTaskCodes.length; i += concurrency) {
    const chunk = expectedTaskCodes.slice(i, i + concurrency);
    const settled = await Promise.allSettled(chunk.map(async (taskCode) => {
      const row = await queryByTaskCode(taskCode);
      return { taskCode, row };
    }));

    settled.forEach((result) => {
      if (result.status !== 'fulfilled') {
        return;
      }
      const taskCode = result.value.taskCode;
      const row = result.value.row;
      if (taskCode && row) {
        map[taskCode] = row;
      }
    });
  }

  return map;
}

async function cancelTaskByAgvCode(agvCode) {
  const targetBase = getTargetRcsBaseUrl();
  if (!targetBase) {
    throw new Error('缺少RCS地址');
  }
  const payload = {
    reqCode: String(Date.now()),
    reqTime: '',
    clientCode: '',
    tokenCode: '',
    forceCancel: '',
    agvCode: String(agvCode || '').trim()
  };
  return await callProxyJson(targetBase + CANCEL_TASK_ENDPOINT, payload);
}

function getActionCellHtml(agvCode, rawStatus) {
  if (!agvCode) {
    return '<span style="color:#999">无AGV编号</span>';
  }
  if (isTaskTerminalStatus(rawStatus)) {
    return '<span class="action-text"></span>';
  }
  const safeCode = escapeHtml(agvCode);
  return '<button class="action-btn" data-action="cancel-task" data-agv-code="' + safeCode + '">取消任务</button>';
}

function getStatusBadgeHtml(rawStatus) {
  const label = normalizeTaskStatusLabel(rawStatus);
  const cls = isTaskDone(rawStatus)
    ? 'status-badge done'
    : (isTaskRunning(rawStatus) ? 'status-badge pending' : 'status-badge');
  return '<span class="' + cls + '">' + escapeHtml(label) + '</span>';
}

function parseDateTime(dateStr) {
  if (!dateStr) return null;
  return new Date(dateStr);
}

function isDateInRange(dateStr, startDate, endDate) {
  if (!dateStr) return false;
  const dt = parseDateTime(dateStr);
  if (!dt) return false;
  if (startDate && dt < startDate) return false;
  if (endDate) {
    const nextDay = new Date(endDate);
    nextDay.setDate(nextDay.getDate() + 1);
    if (dt >= nextDay) return false;
  }
  return true;
}

function applyDateFilter() {
  const startInput = document.getElementById('startDateInput').value;
  const endInput = document.getElementById('endDateInput').value;
  const startDate = startInput ? new Date(startInput) : null;
  const endDate = endInput ? new Date(endInput) : null;
  
  if (!startDate && !endDate) {
    filteredTaskRecords = Array.from(allTaskRecords);
  } else {
    filteredTaskRecords = allTaskRecords.filter(r => {
      return isDateInRange(String(r.created_at || ''), startDate, endDate);
    });
  }
  
  renderTaskRecordRows(filteredTaskRecords, taskStatusMapCache);
}

function resetDateFilter() {
  document.getElementById('startDateInput').value = '';
  document.getElementById('endDateInput').value = '';
  filteredTaskRecords = Array.from(allTaskRecords);
  renderTaskRecordRows(filteredTaskRecords, taskStatusMapCache);
}

function exportToExcel() {
  const rows = filteredTaskRecords.length > 0 ? filteredTaskRecords : allTaskRecords;
  if (rows.length === 0) {
    alert('暂无数据可导出');
    return;
  }
  
  try {
    if (typeof XLSX === 'undefined') {
      alert('Excel导出库加载中，请稍候后重试');
      return;
    }
    
    const data = [];
    data.push(['时间', '任务编号', '发货点', '收货点']);
    
    rows.forEach(r => {
      let first = '-';
      let second = '-';
      try {
        const arr = JSON.parse(r.position_codes || '[]');
        const p1 = arr[0]?.positionCode || arr[0] || '';
        const p2 = arr[1]?.positionCode || arr[1] || '';
        first = toPositionName(p1);
        second = toPositionName(p2);
      } catch (e) {
        first = '-';
        second = '-';
      }
      
      data.push([
        String(r.created_at || '-'),
        String(r.task_typ || '-'),
        first,
        second
      ]);
    });
    
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [
      {wch: 20},
      {wch: 15},
      {wch: 15},
      {wch: 15}
    ];
    
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '任务记录');
    
    const timestamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(0, 14);
    XLSX.writeFile(wb, 'AGV_Task_Records_' + timestamp + '.xlsx');
  } catch (err) {
    console.error('导出Excel错误:', err);
    alert('导出失败: ' + String(err.message || err));
  }
}

function renderTaskRecordRows(rows, taskStatusMap) {
  const tbody = document.getElementById('taskRecordTbody');
  const statusMap = taskStatusMap || {};
  if (!Array.isArray(rows) || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="task-record-empty">暂无任务记录</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => {
    let first = '-';
    let second = '-';
    try {
      const arr = JSON.parse(r.position_codes || '[]');
      const p1 = arr[0]?.positionCode || arr[0] || '';
      const p2 = arr[1]?.positionCode || arr[1] || '';
      first = toPositionName(p1);
      second = toPositionName(p2);
    } catch (e) {
      first = '-';
      second = '-';
    }
    const requestAgvCode = extractAgvCodeFromRawBody(r.raw_body || '');
    const taskCode = String(r.task_code || '').trim() || extractTaskCodeFromResp(r.resp_body || '') || extractTaskCodeFromRawBody(r.raw_body || '');
    const taskInfo = taskCode && statusMap[taskCode] ? statusMap[taskCode] : null;
    const taskStateRaw = taskInfo
      ? (
        taskInfo.taskStatus ??
        taskInfo.task_status ??
        taskInfo.taskstatus ??
        taskInfo.status ??
        ''
      )
      : '';
    const agvCode = String(taskInfo?.agvCode || requestAgvCode || '').trim();
    return '<tr>' +
      '<td>' + escapeHtml(String(r.created_at || '-')) + '</td>' +
      '<td>' + escapeHtml(String(r.task_typ || '-')) + '</td>' +
      '<td>' + escapeHtml(first) + '</td>' +
      '<td>' + escapeHtml(second) + '</td>' +
      '<td>' + getStatusBadgeHtml(taskStateRaw) + '</td>' +
      '<td>' + getActionCellHtml(agvCode, taskStateRaw) + '</td>' +
    '</tr>';
  }).join('');
}

async function loadTaskRecords() {
  const metaEl = document.getElementById('taskRecordMeta');
  metaEl.textContent = '加载中...';
  const candidates = getTaskStatsCandidates();
  let lastError = '';

  for (const url of candidates) {
    try {
      const resp = await fetch(url);
      if (!resp.ok) {
        lastError = 'HTTP ' + resp.status;
        continue;
      }
      const payload = await resp.json();
      const rows = Array.isArray(payload?.recent) ? payload.recent : [];
      allTaskRecords = Array.from(rows);
      filteredTaskRecords = Array.from(rows);
      const taskRecords = rows.map(item => ({
        taskCode: extractTaskCodeFromResp(item?.resp_body || ''),
        agvCode: extractAgvCodeFromRawBody(item?.raw_body || '')
      })).filter(item => item.taskCode || item.agvCode);
      let statusMap = {};
      try {
        statusMap = await batchQueryTaskStatus(taskRecords);
      } catch (e) {
        // 状态查询失败不阻断记录展示
      }
      taskStatusMapCache = statusMap;
      renderTaskRecordRows(rows, statusMap);
      const syncedCount = Object.keys(statusMap).length;
      metaEl.textContent = '已更新: ' + new Date().toLocaleTimeString('zh-CN') + ' | ' + rows.length + ' 条 | 状态同步 ' + syncedCount + ' 条';
      return;
    } catch (e) {
      lastError = String(e && e.message ? e.message : e);
    }
  }

  renderTaskRecordRows([], {});
  metaEl.textContent = '加载失败: ' + (lastError || '未知错误');
}

function goBack(){
  if (window.history.length > 1) {
    window.history.back();
    return;
  }
  window.location.href = 'api-tester.html';
}
document.getElementById('refreshTaskRecordsBtn').addEventListener('click', loadTaskRecords);
document.getElementById('filterBtn').addEventListener('click', applyDateFilter);
document.getElementById('resetFilterBtn').addEventListener('click', resetDateFilter);
document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);

document.getElementById('taskRecordTbody').addEventListener('click', async (event) => {
  const btn = event.target && event.target.closest ? event.target.closest('[data-action="cancel-task"]') : null;
  if (!btn) return;

  const agvCode = String(btn.getAttribute('data-agv-code') || '').trim();
  if (!agvCode) return;
  if (!window.confirm('确认取消AGV任务，AGV编号: ' + agvCode + ' ?')) {
    return;
  }

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '取消中...';
  const metaEl = document.getElementById('taskRecordMeta');
  try {
    const result = await cancelTaskByAgvCode(agvCode);
    const code = String(result?.code == null ? '' : result.code);
    if (code === '0') {
      metaEl.textContent = 'AGV ' + agvCode + ' 已发送取消';
      await loadTaskRecords();
      return;
    }
    const msg = String(result?.message || '取消失败');
    metaEl.textContent = '取消失败: ' + msg;
  } catch (e) {
    metaEl.textContent = '取消失败: ' + String(e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

(async () => {
  await loadAddressConfig();
  await loadTaskRecords();
})();

setInterval(loadTaskRecords, 30000);
</script>
